name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python src/evaluation/evaluate.py
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform/environments/dev init -backend=false -input=false
      - run: terraform -chdir=terraform/environments/dev fmt -check -recursive
      - run: terraform -chdir=terraform/environments/dev validate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
